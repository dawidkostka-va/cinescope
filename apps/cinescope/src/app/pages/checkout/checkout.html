<div class="page">
  <h1 data-testid="checkout-title">Your details</h1>
  <form class="form" [formGroup]="form" novalidate (ngSubmit)="pay()">
    @for (field of fields; track field.name) {
      <div class="field">
        <mat-form-field subscriptSizing="dynamic">
          <mat-label [attr.data-testid]="field.id + '-label'">{{ field.label }}{{ field.required ? ' *' : '' }}</mat-label>
          <input matInput type="text" [formControlName]="field.name" [attr.data-testid]="field.id + '-input'" />
        </mat-form-field>
        @if (error(field.name); as message) {
          <div class="error" [attr.data-testid]="field.id + '-error'">{{ message }}</div>
        }
      </div>
    }
    <div class="field">
      <mat-checkbox formControlName="terms" data-testid="terms-checkbox" (change)="touchTerms()">
        <span data-testid="terms-label">I accept the terms and conditions *</span>
      </mat-checkbox>
      @if (termsError(); as message) {
        <div class="error" data-testid="terms-error">{{ message }}</div>
      }
    </div>
    <div class="actions">
      <button mat-stroked-button type="button" data-testid="checkout-back-button" (click)="back()">Back</button>
      <button mat-flat-button type="submit" data-testid="pay-button" [disabled]="processing()">
        {{ processing() ? 'Processing…' : 'Pay ' + total() + ' PLN' }}
      </button>
    </div>
  </form>
</div>
