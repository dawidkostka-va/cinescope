@if (data(); as d) {
<h1 data-testid="summary-title">Your tickets</h1>

<ul class="list" data-testid="summary-list">
  @for (r of rows(); track r.item.row + '-' + r.item.start) {
  <li class="item" data-testid="summary-item">
    <span class="title" data-testid="summary-item-title">{{ d.movie.title }}</span>
    <span data-testid="summary-item-datetime">{{ d.screening.date }} {{ d.screening.time }}</span>
    <span class="cell">Row <b data-testid="summary-item-row">{{ r.item.row }}</b></span>
    <span class="cell">Seat <b data-testid="summary-item-seat">{{ r.seat }}</b></span>
    <span class="price" data-testid="summary-item-price">{{ r.price }}</span>
    <button
      mat-stroked-button
      type="button"
      data-testid="summary-item-remove-button"
      (click)="remove(r.item)"
    >
      Remove
    </button>
  </li>
  }
</ul>

<p class="total" data-testid="summary-total">Total: {{ total() }}</p>

<div class="actions">
  <button mat-stroked-button type="button" data-testid="back-button" (click)="back()">Back</button>
  <button mat-flat-button type="button" data-testid="confirm-button" (click)="confirm()">
    Confirm
  </button>
</div>
}
