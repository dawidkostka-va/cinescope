<h1 data-testid="summary-title">Your tickets</h1>

<div class="summary-list" data-testid="summary-list">
  @for (item of items(); track item.row + '-' + item.seatLabel) {
    <div class="summary-item" data-testid="summary-item">
      <div data-testid="summary-item-title">{{ movie().title }}</div>
      <div data-testid="summary-item-datetime">{{ dateTime() }}</div>
      <div data-testid="summary-item-row">{{ item.row }}</div>
      <div data-testid="summary-item-seat">{{ item.seatLabel }}</div>
      <div data-testid="summary-item-price">{{ item.priceLabel }}</div>
      <button mat-stroked-button type="button" data-testid="summary-item-remove-button" (click)="remove(item.unit)">
        Remove
      </button>
    </div>
  }
</div>

<div data-testid="summary-total">Total: {{ totalLabel() }}</div>

<div class="actions">
  <button mat-stroked-button type="button" data-testid="back-button" (click)="back()">Back</button>
  <button mat-flat-button type="button" data-testid="confirm-button" (click)="confirm()">Confirm</button>
</div>
