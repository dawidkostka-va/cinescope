@if (screening() && movie()) {
  <h1 data-testid="summary-title">Your tickets</h1>

  <div data-testid="summary-list" class="summary-list">
    @for (unit of units(); track seatLabel(unit) + unit.row) {
      <div data-testid="summary-item" class="summary-item">
        <span data-testid="summary-item-title">{{ movie()?.title }}</span>
        <span data-testid="summary-item-datetime">{{ dateTime() }}</span>
        <span data-testid="summary-item-row">{{ unit.row }}</span>
        <span data-testid="summary-item-seat">{{ seatLabel(unit) }}</span>
        <span data-testid="summary-item-price">{{ priceLabel(unit) }}</span>
        <button mat-stroked-button type="button" data-testid="summary-item-remove-button" (click)="remove(unit)">Remove</button>
      </div>
    }
  </div>

  <p data-testid="summary-total">Total: {{ total() }}</p>

  <div class="actions">
    <button mat-stroked-button type="button" data-testid="back-button" (click)="back()">Back</button>
    <button mat-flat-button type="button" data-testid="confirm-button" (click)="confirm()">Confirm</button>
  </div>
}
