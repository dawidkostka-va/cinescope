<h1 data-testid="summary-title">Your tickets</h1>

<div data-testid="summary-list">
  @for (item of items(); track item.ids.join('-')) {
    <div data-testid="summary-item" class="summary-item">
      <span data-testid="summary-item-title">{{ item.title }}</span>
      <span data-testid="summary-item-datetime">{{ item.datetime }}</span>
      <span data-testid="summary-item-row">{{ item.row }}</span>
      <span data-testid="summary-item-seat">{{ item.seat }}</span>
      <span data-testid="summary-item-price">{{ formatPrice(item.price) }}</span>
      <button mat-stroked-button data-testid="summary-item-remove-button" (click)="remove(item)">Remove</button>
    </div>
  }
</div>

<div data-testid="summary-total">Total: {{ formatPrice(total()) }}</div>

<div class="actions">
  <button mat-stroked-button data-testid="back-button" (click)="back()">Back</button>
  <button mat-flat-button data-testid="confirm-button" (click)="confirm()">Confirm</button>
</div>
