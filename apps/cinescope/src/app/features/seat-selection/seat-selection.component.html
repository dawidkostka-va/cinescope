<h1 data-testid="seat-map-title">Choose your seats</h1>
<h2 data-testid="seat-map-subtitle">Show Date: {{ showDate() }}</h2>

<div class="auditorium-wrapper">
  <p data-testid="seat-limit-info" class="seat-limit-info">You can reserve up to 10 seats per reservation</p>

  <app-auditorium [occupiedSeats]="occupiedSeats()" [selectedSeats]="selectedSeats()" (seatToggle)="onToggle($event)" />
</div>

<app-legend />

<app-selected-seats-panel [selectedSeats]="selectedSeats()" />

<div class="actions">
  <button type="button" mat-stroked-button data-testid="cancel-button" (click)="cancel()">Cancel</button>
  <button
    type="button"
    mat-raised-button
    data-testid="continue-button"
    [disabled]="selectedSeats().length === 0"
    (click)="continue()"
  >
    Continue
  </button>
</div>
