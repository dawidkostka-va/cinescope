@if (data.value(); as value) {
  <main class="page">
    <h1 data-testid="summary-title">Your tickets</h1>

    <ul class="summary-list" data-testid="summary-list">
      @for (item of items(); track item.key) {
        <li class="summary-item" data-testid="summary-item">
          <span data-testid="summary-item-title">{{ value.movie.title }}</span>
          <span data-testid="summary-item-datetime">{{ value.screening.date }} {{ value.screening.time }}</span>
          <span data-testid="summary-item-row">{{ item.row }}</span>
          <span data-testid="summary-item-seat">{{ item.seat }}</span>
          <span data-testid="summary-item-price">{{ item.price }}</span>
          <button mat-stroked-button type="button" data-testid="summary-item-remove-button" (click)="remove(item.cell)">Remove</button>
        </li>
      }
    </ul>

    <p class="total" data-testid="summary-total">{{ totalText() }}</p>

    <div class="actions">
      <button mat-stroked-button type="button" data-testid="back-button" (click)="back()">Back</button>
      <button mat-flat-button type="button" data-testid="confirm-button" (click)="confirm()">Confirm</button>
    </div>
  </main>
}
