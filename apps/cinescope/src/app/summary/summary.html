@if (screening() && movie()) {
  <h1 data-testid="summary-title">Your tickets</h1>

  <ul class="list" data-testid="summary-list">
    @for (item of items(); track item.ids[0]) {
      <li class="item" data-testid="summary-item">
        <span class="title" data-testid="summary-item-title">{{ movie()!.title }}</span>
        <span data-testid="summary-item-datetime">{{ screening()!.date }} {{ screening()!.time }}</span>
        <span data-testid="summary-item-row">{{ item.row }}</span>
        <span data-testid="summary-item-seat">{{ seatText(item) }}</span>
        <span data-testid="summary-item-price">{{ price(item) }}</span>
        <button matButton="outlined" type="button" data-testid="summary-item-remove-button" (click)="remove(item)">Remove</button>
      </li>
    }
  </ul>

  <p class="total" data-testid="summary-total">Total: {{ total() }}</p>

  <div class="actions">
    <button matButton="outlined" type="button" data-testid="back-button" (click)="back()">Back</button>
    <button matButton="filled" type="button" data-testid="confirm-button" (click)="confirm()">Confirm</button>
  </div>
}
