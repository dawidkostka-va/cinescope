<div class="page">
  <h1 data-testid="summary-title">Your tickets</h1>

  @if (data(); as d) {
    <ul class="list" data-testid="summary-list">
      @for (item of items(); track item.key) {
        <li class="item" data-testid="summary-item">
          <span class="field title" data-testid="summary-item-title">{{ d.movie.title }}</span>
          <span class="field" data-testid="summary-item-datetime">{{ d.screening.date }} {{ d.screening.time }}</span>
          <span class="field">Row <span data-testid="summary-item-row">{{ item.row }}</span></span>
          <span class="field" data-testid="summary-item-seat">{{ item.seat }}</span>
          <span class="field price" data-testid="summary-item-price">{{ pln(item.price) }}</span>
          <button mat-stroked-button type="button" data-testid="summary-item-remove-button" (click)="remove(item.key)">
            Remove
          </button>
        </li>
      }
    </ul>

    <p class="total" data-testid="summary-total">Total: {{ pln(total()) }}</p>

    <div class="actions">
      <button mat-stroked-button type="button" data-testid="back-button" (click)="toSeats()">Back</button>
      <button mat-flat-button type="button" data-testid="confirm-button" (click)="toCheckout()">Confirm</button>
    </div>
  }
</div>
