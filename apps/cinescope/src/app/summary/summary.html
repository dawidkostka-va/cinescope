@if (details(); as view) {
  <section class="summary-page">
    <h1 class="title" data-testid="summary-title">Your tickets</h1>

    <ul class="summary-list" data-testid="summary-list">
      @for (ticket of tickets(); track ticket.seatIds[0]) {
        <li class="summary-item" data-testid="summary-item">
          <span class="item-title" data-testid="summary-item-title">{{ view.movie.title }}</span>
          <span class="item-datetime" data-testid="summary-item-datetime">{{ view.screening.date }} {{ view.screening.time }}</span>
          <span class="item-row" data-testid="summary-item-row">{{ ticket.row }}</span>
          <span class="item-seat" data-testid="summary-item-seat">{{ ticket.seat }}</span>
          <span class="item-price" data-testid="summary-item-price">{{ formatPrice(ticket.price) }}</span>
          <button mat-button type="button" data-testid="summary-item-remove-button" (click)="remove(ticket)">Remove</button>
        </li>
      }
    </ul>

    <p class="total" data-testid="summary-total">{{ totalLabel() }}</p>

    <div class="actions">
      <button mat-stroked-button type="button" data-testid="back-button" (click)="back()">Back</button>
      <button mat-flat-button type="button" data-testid="confirm-button" (click)="confirm()">Confirm</button>
    </div>
  </section>
}
