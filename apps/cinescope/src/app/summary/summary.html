@if (data(); as d) {
  <div class="page">
    <h1 data-testid="summary-title">Your tickets</h1>
    <ul class="list" data-testid="summary-list">
      @for (t of tickets(); track t.row + '-' + t.start) {
        <li class="item" data-testid="summary-item">
          <span data-testid="summary-item-title">{{ d.movie.title }}</span>
          <span data-testid="summary-item-datetime">{{ d.screening.date }} {{ d.screening.time }}</span>
          <span class="row-info">Row <span data-testid="summary-item-row">{{ t.row }}</span></span>
          <span class="seat-info">Seat <span data-testid="summary-item-seat">{{ seatDescription(t) }}</span></span>
          <span data-testid="summary-item-price">{{ formatPrice(t.price) }}</span>
          <button mat-stroked-button type="button" data-testid="summary-item-remove-button" (click)="remove(t)">
            Remove
          </button>
        </li>
      }
    </ul>
    <p class="total" data-testid="summary-total">Total: {{ total() }}</p>
    <div class="actions">
      <button mat-stroked-button type="button" data-testid="back-button" (click)="back()">Back</button>
      <button mat-flat-button type="button" data-testid="confirm-button" (click)="confirm()">Confirm</button>
    </div>
  </div>
}
