@if (screening() && movie()) {
  <main class="page">
    <h1 data-testid="summary-title">Your tickets</h1>
    <ul class="summary-list" data-testid="summary-list">
      @for (ticket of items(); track ticket.ids[0]) {
        <li class="summary-item" data-testid="summary-item">
          <span data-testid="summary-item-title">{{ movie()!.title }}</span>
          <span data-testid="summary-item-datetime">{{ screening()!.date }} {{ screening()!.time }}</span>
          <span data-testid="summary-item-row">{{ ticket.row }}</span>
          <span data-testid="summary-item-seat">{{ seatLabel(ticket) }}</span>
          <span data-testid="summary-item-price">{{ price(ticket.price) }}</span>
          <button mat-stroked-button data-testid="summary-item-remove-button" (click)="remove(ticket)">Remove</button>
        </li>
      }
    </ul>
    <p class="summary-total" data-testid="summary-total">Total: {{ total().toFixed(2) }} PLN</p>
    <div class="actions">
      <button mat-stroked-button data-testid="back-button" (click)="back()">Back</button>
      <button mat-flat-button data-testid="confirm-button" (click)="confirm()">Confirm</button>
    </div>
  </main>
}
