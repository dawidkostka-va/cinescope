@let loaded = details(); @if (loaded) {
<h1 data-testid="summary-title">Your tickets</h1>

<ul class="summary-list" data-testid="summary-list">
  @for (item of items(); track item.key) {
  <li class="summary-item" data-testid="summary-item">
    <span class="summary-main">
      <span data-testid="summary-item-title">{{ loaded.movie.title }}</span>
      <span data-testid="summary-item-datetime"
        >{{ loaded.screening.date }} {{ loaded.screening.time }}</span
      >
      <span>Row <span data-testid="summary-item-row">{{ item.row }}</span></span>
      <span>Seat <span data-testid="summary-item-seat">{{ item.seat }}</span></span>
      <span data-testid="summary-item-price">{{ formatPrice(item.price) }}</span>
    </span>
    <button
      mat-stroked-button
      data-testid="summary-item-remove-button"
      (click)="remove(item.key, loaded.screening.id)"
    >
      Remove
    </button>
  </li>
  }
</ul>

<p class="total" data-testid="summary-total">{{ totalLabel() }}</p>

<div class="actions">
  <button mat-stroked-button data-testid="back-button" (click)="back(loaded.screening.id)">
    Back
  </button>
  <button mat-flat-button data-testid="confirm-button" (click)="confirm(loaded.screening.id)">
    Confirm
  </button>
</div>
}
