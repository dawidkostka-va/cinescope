@if (data(); as d) {
  <h1 data-testid="summary-title">Your tickets</h1>

  <ul class="summary-list" data-testid="summary-list">
    @for (ticket of booking.tickets(); track ticket.ids[0]) {
      <li class="summary-item" data-testid="summary-item">
        <span class="field title" data-testid="summary-item-title">{{ d.movie.title }}</span>
        <span class="field" data-testid="summary-item-datetime">{{ d.screening.date }} {{ d.screening.time }}</span>
        <span class="field">Row <span data-testid="summary-item-row">{{ ticket.row }}</span></span>
        <span class="field">Seat <span data-testid="summary-item-seat">{{ seatText(ticket) }}</span></span>
        <span class="field price" data-testid="summary-item-price">{{ formatPrice(ticket.price) }}</span>
        <button mat-stroked-button type="button" data-testid="summary-item-remove-button" (click)="remove(ticket)">
          Remove
        </button>
      </li>
    }
  </ul>

  <p class="total" data-testid="summary-total">{{ totalText() }}</p>

  <div class="actions">
    <button mat-stroked-button type="button" data-testid="back-button" (click)="back()">Back</button>
    <button mat-flat-button type="button" data-testid="confirm-button" (click)="confirm()">Confirm</button>
  </div>
}
