@if (screening() && movie()) {
  <div class="page">
    <h1 data-testid="summary-title">Your tickets</h1>
    <ul class="list" data-testid="summary-list">
      @for (item of items(); track item.ids[0]) {
        <li class="item" data-testid="summary-item">
          <span data-testid="summary-item-title">{{ movie()!.title }}</span>
          <span data-testid="summary-item-datetime">{{ screening()!.date }} {{ screening()!.time }}</span>
          <span>Row <span data-testid="summary-item-row">{{ item.row }}</span></span>
          <span>Seat <span data-testid="summary-item-seat">{{ seatText(item) }}</span></span>
          <span data-testid="summary-item-price">{{ formatPrice(item.price) }}</span>
          <button mat-stroked-button type="button" data-testid="summary-item-remove-button" (click)="remove(item)">
            Remove
          </button>
        </li>
      }
    </ul>
    <p class="total" data-testid="summary-total">Total: {{ formatPrice(total()) }}</p>
    <div class="actions">
      <button mat-stroked-button type="button" data-testid="back-button" (click)="back()">Back</button>
      <button mat-flat-button type="button" data-testid="confirm-button" (click)="confirm()">Confirm</button>
    </div>
  </div>
}
