<div class="page">
  <h1 data-testid="summary-title">Your tickets</h1>

  @if (data(); as d) {
    <ul class="list" data-testid="summary-list">
      @for (item of booking.items(); track item.ids[0]) {
        <li class="item" data-testid="summary-item">
          <span class="title" data-testid="summary-item-title">{{ d.movie.title }}</span>
          <span data-testid="summary-item-datetime">{{ d.screening.date }} {{ d.screening.time }}</span>
          <span class="cell">Row <b data-testid="summary-item-row">{{ item.row }}</b></span>
          <span class="cell">Seat <b data-testid="summary-item-seat">{{ seatText(item) }}</b></span>
          <span class="price" data-testid="summary-item-price">{{ formatPrice(item.price) }}</span>
          <button mat-stroked-button type="button" data-testid="summary-item-remove-button" (click)="remove(item)">
            Remove
          </button>
        </li>
      }
    </ul>

    <p class="total" data-testid="summary-total">Total: {{ formatPrice(booking.total()) }}</p>

    <div class="actions">
      <button mat-stroked-button type="button" data-testid="back-button" (click)="back()">Back</button>
      <button mat-flat-button type="button" data-testid="confirm-button" (click)="confirm()">Confirm</button>
    </div>
  }
</div>
