<main class="page">
  @if (details(); as details) {
    <h1 data-testid="summary-title">Your tickets</h1>

    <ul class="list" data-testid="summary-list">
      @for (line of lines(); track line.id) {
        <li class="item" data-testid="summary-item">
          <span data-testid="summary-item-title">{{ details.movie.title }}</span>
          <span data-testid="summary-item-datetime">{{ details.screening.date }} {{ details.screening.time }}</span>
          <span data-testid="summary-item-row">{{ line.row }}</span>
          <span data-testid="summary-item-seat">{{ line.seat }}</span>
          <span data-testid="summary-item-price">{{ line.price }}</span>
          <button mat-stroked-button data-testid="summary-item-remove-button" (click)="remove(line.id)">Remove</button>
        </li>
      }
    </ul>

    <p class="total" data-testid="summary-total">{{ totalLabel() }}</p>

    <div class="actions">
      <button mat-stroked-button data-testid="back-button" (click)="back()">Back</button>
      <button mat-flat-button data-testid="confirm-button" (click)="confirm()">Confirm</button>
    </div>
  }
</main>
