<main class="summary-page">
  <h1 class="page-title" data-testid="summary-title">Your tickets</h1>

  @if (loaded(); as data) {
    <ul class="summary-list" data-testid="summary-list">
      @for (item of items(); track item.key) {
        <li class="summary-item" data-testid="summary-item">
          <div class="summary-details">
            <p class="summary-movie" data-testid="summary-item-title">{{ data.movie.title }}</p>
            <p class="summary-meta">
              <span data-testid="summary-item-datetime">{{ data.screening.date }} {{ data.screening.time }}</span>
            </p>
            <p class="summary-meta">
              Row <span data-testid="summary-item-row">{{ item.seat.row }}</span>,
              seat <span data-testid="summary-item-seat">{{ item.description }}</span>
            </p>
          </div>
          <span class="summary-price" data-testid="summary-item-price">{{ item.price }}</span>
          <button
            mat-stroked-button
            type="button"
            data-testid="summary-item-remove-button"
            (click)="remove(item.seat)"
          >Remove</button>
        </li>
      }
    </ul>

    <p class="summary-total" data-testid="summary-total">Total: {{ total() }}</p>

    <div class="actions">
      <button mat-stroked-button type="button" data-testid="back-button" (click)="back()">Back</button>
      <button mat-flat-button type="button" data-testid="confirm-button" (click)="confirm()">Confirm</button>
    </div>
  }
</main>
