@if (view(); as v) {
<main class="page">
  <h1 class="title" data-testid="summary-title">Your tickets</h1>

  <ul class="items" data-testid="summary-list">
    @for (item of items(); track item.key) {
    <li class="item" data-testid="summary-item">
      <span class="movie" data-testid="summary-item-title">{{ v.movie.title }}</span>
      <span class="datetime" data-testid="summary-item-datetime"
        >{{ v.screening.date }} {{ v.screening.time }}</span
      >
      <span class="row">Row <span data-testid="summary-item-row">{{ item.cell.row }}</span></span>
      <span class="seat" data-testid="summary-item-seat">{{ item.seat }}</span>
      <span class="price" data-testid="summary-item-price">{{ item.price }}</span>
      <button
        mat-stroked-button
        data-testid="summary-item-remove-button"
        (click)="remove(item.cell)"
      >
        Remove
      </button>
    </li>
    }
  </ul>

  <p class="total" data-testid="summary-total">{{ total() }}</p>

  <div class="actions">
    <button mat-stroked-button data-testid="back-button" (click)="back()">Back</button>
    <button mat-flat-button data-testid="confirm-button" (click)="confirm()">Confirm</button>
  </div>
</main>
}
