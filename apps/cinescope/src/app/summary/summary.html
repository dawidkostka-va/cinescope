<main class="page">
  <h1 data-testid="summary-title">Your tickets</h1>

  <section class="summary-list" data-testid="summary-list">
    @for (ticket of tickets(); track ticket.ids[0]) {
    <article class="summary-item" data-testid="summary-item">
      <span class="field" data-testid="summary-item-title">{{ movie()?.title }}</span>
      <span class="field" data-testid="summary-item-datetime"
        >{{ screening()?.date }} {{ screening()?.time }}</span
      >
      <span class="field" data-testid="summary-item-row">{{ ticket.row }}</span>
      <span class="field" data-testid="summary-item-seat">{{ ticket.seatLabel }}</span>
      <span class="field" data-testid="summary-item-price">{{ formatPrice(ticket.price) }}</span>
      <button
        mat-stroked-button
        type="button"
        data-testid="summary-item-remove-button"
        (click)="remove(ticket.ids)"
      >
        Remove
      </button>
    </article>
    }
  </section>

  <p class="total" data-testid="summary-total">Total: {{ formatPrice(total()) }}</p>

  <div class="actions">
    <button mat-stroked-button type="button" data-testid="back-button" (click)="back()">
      Back
    </button>
    <button mat-flat-button type="button" data-testid="confirm-button" (click)="confirm()">
      Confirm
    </button>
  </div>
</main>
