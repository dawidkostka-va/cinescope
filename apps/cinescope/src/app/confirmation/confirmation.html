<section class="confirmation-page">
  <h1 class="title" data-testid="confirmation-heading">Payment successful</h1>
  <p class="message" data-testid="confirmation-message">Your tickets will be sent shortly to {{ email }}</p>
  <button mat-flat-button type="button" data-testid="confirmation-continue-button" (click)="continueToMovies()">Continue</button>
</section>
