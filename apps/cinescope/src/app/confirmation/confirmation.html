<main class="confirmation-page">
  <h1 class="page-title" data-testid="confirmation-heading">Payment successful</h1>

  <p class="confirmation-message" data-testid="confirmation-message">Your tickets will be sent shortly to {{ email }}</p>

  <div class="actions">
    <button mat-flat-button type="button" data-testid="confirmation-continue-button" (click)="continue()">Continue</button>
  </div>
</main>
