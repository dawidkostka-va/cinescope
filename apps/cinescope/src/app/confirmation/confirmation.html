<main class="confirmation-page">
  <h1 class="page-title" data-testid="confirmation-heading">Payment successful</h1>
  <p class="message" data-testid="confirmation-message">Your tickets will be sent shortly to {{ email }}</p>
  <button
    type="button"
    matButton="filled"
    data-testid="confirmation-continue-button"
    (click)="continue()"
  >Continue</button>
</main>
